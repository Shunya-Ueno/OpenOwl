# 直前の検索が履歴に並び、詳細を開けることを確認する。
#
# **必ず自分で検索してから確認する。** 以前は 02 が残した履歴に依存し、
# かつ「開いた詳細がその単語か」を検証していなかったため、02 の保存が
# 静かに壊れて古い履歴が残っているだけでも緑になった。
appId: ${APP_ID}
---
- runFlow: ../subflows/ensure-signed-in.yaml

# このフロー自身で履歴を1件作る(キャッシュに当たるので LLM は呼ばれない)。
- tapOn:
    id: 'home-word-input'
- eraseText
- inputText: 'happy'
- hideKeyboard
- tapOn:
    id: 'home-generate-button'
- extendedWaitUntil:
    visible:
      id: 'synonym-list'
    timeout: 30000

- tapOn: '履歴'

# 先頭(=最新)の項目を開く。testID はエンティティ由来なので正規表現で掴む。
- extendedWaitUntil:
    visible:
      id: 'history-item-.*'
    timeout: 15000
- tapOn:
    id: 'history-item-.*'
    index: 0

- extendedWaitUntil:
    visible:
      id: 'history-detail-word'
    timeout: 15000

# 開いた詳細が「たった今検索した単語」であることまで確認する。
- assertVisible: 'happy'
- assertVisible:
    id: 'synonym-list'
