# Maestro のワークスペース設定。
#
# **このファイルは `maestro test <このディレクトリ>` を指定したときにだけ読まれる。**
# flows/ を直接指定すると config.yaml が読まれず ${APP_ID} が未解決になるため、
# 実行は必ずワークスペースルート(e2e/)を指定すること。
flows:
  - flows/*.yaml

env:
  # 静的な値なのでここに置く。app.config.ts の ANDROID_PACKAGE と一致させること。
  APP_ID: com.openowl.app

# E2E_USER_EMAIL / E2E_USER_PASSWORD は秘密情報なのでここには書かない。
# Maestro はシェルの環境変数を自動注入しないため、実行時に -e で明示的に渡す
# (frontend/package.json の e2e スクリプトを参照)。
