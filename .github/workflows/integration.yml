# バックエンド統合テスト。**テスト用 Supabase と実 Gemini API に接続する**。
#
# 契機を絞っているのは、実 API に課金が発生すること(docs/adr/0006)による
# (docs/testing/ci-pipeline.md)。
name: Integration tests

on:
  # `run-integration` ラベルが「付いた瞬間」のみ自動実行する。
  # synchronize を含めると、ラベル付き PR への毎 push で課金スイートが再実行され、
  # 古いコミットのテストが直列キューに積まれる。再実行したいときはラベルを付け直す。
  pull_request:
    types: [labeled]
  workflow_dispatch:

# テスト用プロジェクトを共有しているため、同時に走らせない。
# 並行するとレート制限やテストデータの取り合いで不安定になる。
concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  integration:
    name: backend integration (real Supabase + Gemini)
    runs-on: ubuntu-latest
    # ラベルは「コストの門」であって「fork の門」ではない。head リポジトリも確認しないと、
    # 外部コントリビュータの PR にラベルを付けた瞬間シークレット空で実行され、
    # 「相手のブランチが壊れている」ように見える赤 X が出る(実際は権限の問題)。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-integration' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ローカルと同じ1本のスクリプトを使うため、Secrets から .env.test を書き出す。
      # :ci 用の別スクリプトを持つと、権限フラグ等の変更が片側にだけ適用され、
      # 「ローカルは緑・CI は失敗」という再現困難な乖離を生む。
      # ランナーは実行ごとに破棄されるため、ファイルは残らない。
      - name: Write .env.test from secrets
        working-directory: backend
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
        run: |
          # GEMINI_API_KEY はここに書かない。Edge Function が Supabase 側の
          # シークレットとして保持しており、CI は Function を呼ぶだけでよい
          # (CI に置かない鍵は漏れない。docs/testing/ci-pipeline.md)。
          {
            printf 'TEST_SUPABASE_URL=%s\n' "$TEST_SUPABASE_URL"
            printf 'TEST_SUPABASE_PUBLISHABLE_KEY=%s\n' "$TEST_SUPABASE_PUBLISHABLE_KEY"
            printf 'TEST_SUPABASE_SECRET_KEY=%s\n' "$TEST_SUPABASE_SECRET_KEY"
          } > .env.test

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration
